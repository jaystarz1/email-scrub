button.big{font-size:17px;padding:10px 26px}

.chip{background:var(--soft);border-radius:12px;padding:2px 10px;font-size:13px}
.status{font-weight:600}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.alarm{border:2px solid var(--bad);background:var(--alarm);border-radius:6px;padding:10px 12px;margin:0 0 10px}

ul.people code{background:var(--tok);color:var(--tokink);border-radius:3px;padding:0 3px}
details summary{cursor:pointer;color:var(--accent)}
footer{color:var(--muted);font-size:13px;margin-top:18px}
